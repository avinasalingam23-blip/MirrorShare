name: Build Mirror Share TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AndroidTVReceiver/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-tv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Build test APK
        working-directory: AndroidTVReceiver
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and prepare APK
        run: |
          mkdir -p artifacts
          cp AndroidTVReceiver/app/build/outputs/apk/debug/app-debug.apk artifacts/MirrorShare-TV-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose artifacts/MirrorShare-TV-test.apk
          cd artifacts
          sha256sum MirrorShare-TV-test.apk > SHA256SUMS.txt

      - name: Save downloadable APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MirrorShare-TV-test
          path: |
            artifacts/MirrorShare-TV-test.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
